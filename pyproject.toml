[project]
name = "agentgate"
version = "0.1.0"
description = "Tests, traces and a regression gate for AI agents, with a model router you can measure."
requires-python = ">=3.10"
dependencies = ["anthropic"]

[project.scripts]
agentgate = "agentgate.cli:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agentgate"]
